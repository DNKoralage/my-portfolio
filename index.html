<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devnith Koralage | Portfolio</title>
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Netlify Identity Widget (Login / Recovery ටෝකන් වැඩ කරන්න අත්‍යවශ්‍යයි) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <!-- Header / Navigation Bar -->
    <header>
        <nav class="navbar">
            <div class="logo">Devnith Koralage</div>
            <ul class="nav-links">
                <li><a href="#home" class="active">Home</a></li>
                <li><a href="#about">About us</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#contact">Skills & Contact</a></li>
            </ul>
            <div class="social-icons">
                <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
                <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </nav>
    </header>

    <!-- Main Content Section -->
    <main id="home">
        <section class="hero">
            <div class="hero-badge">FULL-STACK WEB DEVELOPER & SYSTEMS ENGINEER</div>
            <h1>Build digital</h1>
        </section>
    </main>

    <!-- Footer / Widgets -->
    <footer>
        <!-- ඔයාගේ අවශ්‍යතාවය අනුව මෙතැනට Instagram Widget Embed එක දාගන්න පුළුවන් -->
    </footer>

    <!-- JavaScript Files -->
    <script src="script.js"></script>

    <!-- Netlify Identity Widget Redirection Fix (Password Reset සාර්ථක වීමට මේක උදව් වේ) -->
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
