<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructive - Admin Dashboard</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-cube"></i>
                <h2>Constructive</h2>
            </div>
            <ul class="menu">
                <li class="active"><a href="#"><i class="fa-solid fa-house"></i> Dashboard <span class="badge">1</span></a></li>
                <li><a href="#"><i class="fa-solid fa-file-lines"></i> Pages <span class="badge">3</span></a></li>
                <li><a href="#"><i class="fa-solid fa-note-sticky"></i> Posts <span class="badge red">New</span></a></li>
                <li><a href="#"><i class="fa-solid fa-folder"></i> Media Files <span class="badge">1</span></a></li>
                <li><a href="#"><i class="fa-solid fa-gear"></i> Settings <span class="badge">1</span></a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search">
                </div>
                <div class="user-profile">
                    <i class="fa-regular fa-bell"></i>
                    <img src="https://i.pravatar.cc/40?img=3" alt="Admin">
                    <span>Devnith K.</span>
                </div>
            </header>

            <section class="stats-overview">
                <div class="card-row">
                    <div class="info-card">
                        <div class="doc-icon blue"><i class="fa-regular fa-file"></i></div>
                        <div>
                            <h4>Home & Hero Customizer</h4>
                            <p>Manage site titles, logos, and hero sections easily.</p>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="doc-icon orange"><i class="fa-regular fa-folder"></i></div>
                        <div>
                            <h4>Global Settings</h4>
                            <p>Update theme colors and core configurations.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
